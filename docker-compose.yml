services:

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:14-alpine
    container_name: postgres-keycloak
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: ['start-dev', '--import-realm']
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${KC_DB_HOST}
      KC_DB_URL_DATABASE: ${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: public
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_FEATURES: token-exchange,scripts
      KC_LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${KEYCLOAK_PORT}:8080"
      - "8443:8443"
    volumes:
      - ./keycloak/conf:/opt/keycloak/conf
      - ./keycloak/conf/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    cap_add:
      - IPC_LOCK
    env_file:
      - .env
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT}:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status -address=http://127.0.0.1:8200 2>&1 | grep -q 'Initialized'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sleep 2 &&
        vault kv put ${VAULT_SECRET_PATH}
        db.username=${DB_USERNAME}
        db.password=${DB_PASSWORD}
        db.port=${DB_PORT}
        db.name=${DB_NAME}
        keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
        jwt.secret=${JWT_SECRET}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}
    env_file:
      - .env
    environment:
      QUARKUS_HTTP_PORT: ${APP_PORT}
      DB_HOST: postgres
      QUARKUS_VAULT_URL: ${VAULT_ADDR}
      QUARKUS_VAULT_AUTHENTICATION_CLIENT_TOKEN: ${VAULT_TOKEN}
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      QUARKUS_OIDC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      QUARKUS_OIDC_TOKEN_ISSUER: http://keycloak:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      QUARKUS_REST_CLIENT_KEYCLOAK_TOKEN_CLIENT_URL: http://keycloak:${KEYCLOAK_PORT}
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: http://keycloak:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      MP_JWT_VERIFY_ISSUER: http://keycloak:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      QUARKUS_LOG_LEVEL: ${LOG_LEVEL}
      QUARKUS_LOG_CATEGORY__BR_COM__LEVEL: ${APP_LOG_LEVEL}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT}/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: on-failure

volumes:
  postgres_data:
    driver: local
  postgres_kc_data:
    driver: local
