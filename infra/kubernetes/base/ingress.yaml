apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olist-ingress
  namespace: olist
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: olist-api.example.com  # substituído por overlay
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: olist-app-service
                port:
                  number: 80
          - path: /q
            pathType: Prefix
            backend:
              service:
                name: olist-app-service
                port:
                  number: 80
    - host: keycloak.example.com  # substituído por overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
