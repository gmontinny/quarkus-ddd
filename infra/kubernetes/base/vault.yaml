apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: olist
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          args: ["server", "-dev"]
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: VAULT_DEV_ROOT_TOKEN_ID
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: olist
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: olist
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-vault
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z vault-service 8200; do echo waiting for vault; sleep 2; done"]
      containers:
        - name: vault-init
          image: hashicorp/vault:1.15
          env:
            - name: VAULT_ADDR
              value: http://vault-service:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: VAULT_TOKEN
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: DB_PASSWORD
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: DB_NAME
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: olist-secrets
                  key: JWT_SECRET
          command:
            - sh
            - -c
            - |
              sleep 3
              vault kv put secret/olist-app \
                db.username=$DB_USERNAME \
                db.password=$DB_PASSWORD \
                db.port=$DB_PORT \
                db.name=$DB_NAME \
                keycloak.client-secret=$KEYCLOAK_CLIENT_SECRET \
                jwt.secret=$JWT_SECRET
