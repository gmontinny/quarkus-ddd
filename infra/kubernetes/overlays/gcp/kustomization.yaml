apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: olist

bases:
  - ../../base

images:
  - name: olist-app:latest
    newName: <GCP_REGION>-docker.pkg.dev/<GCP_PROJECT_ID>/olist/olist-app
    newTag: latest

patches:
  # StorageClass GCP Persistent Disk SSD
  - patch: |-
      - op: add
        path: /spec/storageClassName
        value: premium-rwo
    target:
      kind: PersistentVolumeClaim
  # Ingress com GCE Ingress Controller
  - patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: gce
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: gce
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: olist-static-ip
      - op: replace
        path: /spec/rules/0/host
        value: olist-api.gcp.example.com
      - op: replace
        path: /spec/rules/1/host
        value: keycloak.gcp.example.com
    target:
      kind: Ingress
      name: olist-ingress
