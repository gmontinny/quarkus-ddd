# Application
quarkus.application.name=${APP_NAME:quarkus-ddd}

# HTTP
quarkus.http.port=8081
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# Dev Services desabilitado — infraestrutura via docker-compose
quarkus.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false

# Vault — prod/Docker
quarkus.vault.url=${QUARKUS_VAULT_URL:http://localhost:8200}
quarkus.vault.authentication.client-token=${QUARKUS_VAULT_AUTHENTICATION_CLIENT_TOKEN:myroot}
quarkus.vault.kv-secret-engine-mount-path=secret
quarkus.vault.secret-config-kv-path=olist-app

# DataSource — JDBC (Liquibase) + Reactive (Hibernate Reactive)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${db.username}
quarkus.datasource.password=${db.password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${db.port}/${db.name}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${db.port}/${db.name}


# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# OIDC / Keycloak
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/spring-webflux}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:spring-webflux-client}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:spring-webflux-secret}
quarkus.oidc.token.issuer=${QUARKUS_OIDC_TOKEN_ISSUER:http://localhost:8080/realms/spring-webflux}
quarkus.oidc.roles.source=accesstoken
# Desabilita discovery no boot — evita WARN/ERROR se Keycloak ainda estiver inicializando
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs
quarkus.oidc.introspection-path=protocol/openid-connect/token/introspect

# Keycloak Auth Service
keycloak.realm=${KEYCLOAK_REALM:spring-webflux}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:spring-webflux-client}
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET:spring-webflux-secret}

# REST Client — URL base do Keycloak (sem /realms/...)
quarkus.rest-client.keycloak-token-client.url=${QUARKUS_REST_CLIENT_KEYCLOAK_TOKEN_CLIENT_URL:http://localhost:8080}
quarkus.rest-client.keycloak-admin-client.url=${QUARKUS_REST_CLIENT_KEYCLOAK_ADMIN_CLIENT_URL:http://localhost:8080}

# MicroProfile JWT
mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION:http://localhost:8080/realms/spring-webflux/protocol/openid-connect/certs}
mp.jwt.verify.issuer=${MP_JWT_VERIFY_ISSUER:http://localhost:8080/realms/spring-webflux}

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Logging
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."br.com".level=${QUARKUS_LOG_CATEGORY__BR_COM__LEVEL:DEBUG}

# OpenAPI Info
mp.openapi.extensions.smallrye.info.title=Olist DDD API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Quarkus DDD API com Keycloak, JWT, Vault e Reactive PostgreSQL
mp.openapi.extensions.smallrye.security.scheme.name=BearerAuth
mp.openapi.extensions.smallrye.security.scheme.type=http
mp.openapi.extensions.smallrye.security.scheme.scheme=bearer
mp.openapi.extensions.smallrye.security.scheme.bearer-format=JWT

# ===== Dev Profile =====
# Vault desabilitado — credenciais diretas do .env
%dev.quarkus.vault.secret-config-kv-path=
%dev.quarkus.datasource.username=${DB_USERNAME:olist}
%dev.quarkus.datasource.password=${DB_PASSWORD:olist}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:olist}
%dev.quarkus.datasource.reactive.url=postgresql://localhost:${DB_PORT:5432}/${DB_NAME:olist}
%dev.quarkus.oidc.auth-server-url=http://localhost:8080/realms/spring-webflux
%dev.quarkus.oidc.token.issuer=http://localhost:8080/realms/spring-webflux
%dev.quarkus.rest-client.keycloak-token-client.url=http://localhost:8080
%dev.quarkus.rest-client.keycloak-admin-client.url=http://localhost:8080
%dev.mp.jwt.verify.publickey.location=http://localhost:8080/realms/spring-webflux/protocol/openid-connect/certs
%dev.mp.jwt.verify.issuer=http://localhost:8080/realms/spring-webflux
%dev.quarkus.oidc.discovery-enabled=false
%dev.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%dev.quarkus.oidc.introspection-path=protocol/openid-connect/token/introspect

# ===== Test Profile =====
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=olist
%test.quarkus.datasource.password=olist
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/olist
%test.quarkus.datasource.reactive.url=postgresql://localhost:5432/olist
%test.quarkus.oidc.enabled=false
%test.quarkus.vault.secret-config-kv-path=
%test.quarkus.liquibase.migrate-at-start=false
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://test-issuer
%test.db.username=olist
%test.db.password=olist
%test.db.port=5432
%test.db.name=olist
%test.keycloak.realm=test-realm
%test.keycloak.client-id=test-client
%test.keycloak.credentials.secret=test-secret
